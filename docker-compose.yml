services:

  # ── Open-source LLM server (free, runs locally) ──────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    command: >
      sh -c "ollama serve &
             sleep 10 &&
             ollama pull hermes3:8b &&
             wait"
    # GPU support (uncomment if you have an NVIDIA GPU + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /api/tags HTTP/1.0\\r\\n\\r\\n\" > /dev/tcp/localhost/11434' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── KawaiiGPT Hermes Agent (Autonomous mode) ──────────────────────────────
  hermes-agent:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
    volumes:
      - ./hermes_sessions:/app/hermes_sessions
      - ./pentest:/app/pentest

  # ── KawaiiGPT chat app ────────────────────────────────────────────────────
  chat:
    build: .
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # To use Anthropic instead, set this and remove OLLAMA_HOST:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # To use Groq (free tier) instead:
      # - GROQ_API_KEY=${GROQ_API_KEY}

volumes:
  ollama_data:
